# Release: on a version tag (v1.0.0, v1.0.0-beta.1, ...), the CI runs again on the tagged commit,
# the game is built from scratch (no cache) for Windows x64, Linux x86-64, Linux aarch64 and,
# experimentally, macOS on Apple Silicon, the build provenance of the files is attested
# (actions/attest) and a GitHub release is published with them. A manual
# run builds the branch or tag it is started on; it publishes only from a tag and when asked to,
# and otherwise keeps the files as workflow artifacts (a dry run).
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the GitHub release (run from a tag only)
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the version and check the tag
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          PUBLISH_INPUT: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          version=$(cmake -P cmake/version.cmake)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::cmake/version.cmake gives '$version', not a SemVer version"
            exit 1
          fi
          publish=false
          if [[ "$REF_TYPE" == tag ]]; then
            if [[ "$REF_NAME" != "v$version" ]]; then
              echo "::error::tag $REF_NAME does not match the version in cmake/version.cmake (v$version)"
              exit 1
            fi
            publish=$PUBLISH_INPUT
          elif [[ "$PUBLISH_INPUT" == true ]]; then
            echo "::error::a release is only published from a tag (this run is on $REF_NAME)"
            exit 1
          fi
          prerelease=false
          [[ "$version" == *-* ]] && prerelease=true
          {
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          echo "Version $version (pre-release: $prerelease, publish: $publish)" >> "$GITHUB_STEP_SUMMARY"

  ci:
    name: CI
    needs: version
    permissions:
      contents: read
    uses: $/.github/workflows/ci.yml

  build:
    name: Windows release build
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build \
            g++-mingw-w64-x86-64-posix gcc-mingw-w64-x86-64-posix binutils-mingw-w64-x86-64

      # A clean build: no compiler cache, and no voice model (the game downloads it itself; the
      # release holds the executable only).
      - name: Configure
        run: >-
          cmake -B build-win -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64-x86_64.cmake
          -DCMAKE_BUILD_TYPE=Release -DSCACELITH_SUPERTONIC_DOWNLOAD=OFF

      - name: Build
        run: ninja -C build-win

      - name: Check the version of the executable
        run: |
          grep -q "#define SCACELITH_VERSION \"$VERSION\"" build-win/generated/scacelith_version.h
          grep -aq "Scacelith $VERSION" build-win/Scacelith.exe

      # The archive holds the executable, the licence and the licence texts of what it embeds (the
      # fonts, Stockfish's authors, the QR code generator and the opening names), as README.md's
      # "Licence" section lists them.
      - name: Package
        env:
          COMMIT: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
        run: |
          name="Scacelith-$VERSION-windows-x64"
          dir="dist/$name"
          mkdir -p "$dir/licences/fonts"
          cp build-win/Scacelith.exe "$dir/"
          cp LICENSE "$dir/LICENSE.txt"
          cp assets/fonts/*.txt assets/fonts/hand/*.txt "$dir/licences/fonts/"
          cp third_party/stockfish/AUTHORS "$dir/licences/Stockfish-AUTHORS.txt"
          cp third_party/qrcodegen/LICENSE "$dir/licences/qrcodegen-MIT.txt"
          cp assets/licences/lichess-chess-openings-CC0.txt "$dir/licences/"
          cat > "$dir/README.txt" <<EOF
          Scacelith $VERSION for Windows x64

          A photorealistic chess game played in first person against a porcelain robot driven by
          Stockfish 19 (embedded), or online. Needs a GPU with OpenGL 4.6. Run Scacelith.exe.

          Source: $REPOSITORY ($REF_NAME, commit $COMMIT).
          Scacelith is free software under the GNU General Public License v3.0 (LICENSE.txt). The licence
          texts of the fonts, of Stockfish's authors and of the other parts it embeds are in licences/.

          The coach's voice model (Supertonic 3, BigScience Open RAIL-M licence) is not included: the
          game offers to download it from Supertone's repository on Hugging Face the first time
          Coach mode needs it.

          To check this download with the GitHub CLI:
            gh attestation verify $name.zip --repo $GITHUB_REPOSITORY
          EOF
          # Text files with Windows line endings.
          find "$dir" -name '*.txt' -exec sed -i 's/\r\?$/\r/' {} +
          (cd dist && zip -9 -r -X "$name.zip" "$name")
          cp "$dir/Scacelith.exe" "dist/$name.exe"
          rm -r "${dir:?}"

      - name: Upload the Windows files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-windows-x64
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # Built on the oldest supported Ubuntu (22.04), so that the game runs on the distributions of 2021
  # onwards: libstdc++ and libgcc are linked in (CMakeLists.txt); glibc, OpenSSL 3, X11 and OpenGL
  # are the system's (OpenSSL then finds the system's certificates where its distribution put
  # them), and ALSA and libsecret are loaded at run time when present.
  linux:
    name: Linux x86-64 release build
    needs: version
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++ \
            libssl-dev libx11-dev libgl-dev desktop-file-utils

      # A clean build, as for Windows: no compiler cache, no voice model.
      - name: Configure
        run: >-
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSCACELITH_SUPERTONIC_DOWNLOAD=OFF

      - name: Build
        run: ninja -C build

      # The tests again: the CI builds on Ubuntu 24.04 (GCC 13), the release with Ubuntu 22.04's
      # GCC 11, binutils 2.38 and OpenSSL 3.0.2.
      - name: Unit tests
        run: ./build/scacelith_tests

      # The version, and what the executable needs from the system: only libraries every desktop
      # distribution has (no libstdc++, libgcc_s, libasound or libsecret), and no glibc newer than
      # 2.34 (the README's requirement).
      - name: Check the executable
        run: |
          grep -q "#define SCACELITH_VERSION \"$VERSION\"" build/generated/scacelith_version.h
          grep -aq "Scacelith $VERSION" build/scacelith
          allowed=" libX11.so.6 libGL.so.1 libssl.so.3 libcrypto.so.3 libm.so.6 libc.so.6 ld-linux-x86-64.so.2 "
          needed=$(readelf -d build/scacelith | sed -n 's/.*(NEEDED).*\[\(.*\)\]/\1/p')
          for lib in $needed; do
            echo "needs $lib"
            if [[ "$allowed" != *" $lib "* ]]; then
              echo "::error::build/scacelith needs $lib, which is not on the list of system libraries"
              exit 1
            fi
          done
          glibc=$(objdump -T build/scacelith | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n 1)
          echo "newest glibc symbol version: $glibc"
          if [[ "$(printf '%s\n' "$glibc" GLIBC_2.34 | sort -V | tail -n 1)" != GLIBC_2.34 ]]; then
            echo "::error::build/scacelith needs $glibc, newer than the 2.34 the README promises"
            exit 1
          fi

      # The archive: the executable, its launcher and icons (share/, laid out like ~/.local/share),
      # install.sh, the licence and the licence texts of what it embeds, as for Windows.
      - name: Package
        env:
          COMMIT: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
        run: |
          name="Scacelith-$VERSION-linux-x86_64"
          dir="dist/$name"
          share="$dir/share"
          install -D -m 755 build/scacelith "$dir/scacelith"
          install -D -m 755 res/linux/install.sh "$dir/install.sh"
          desktop-file-validate res/linux/scacelith.desktop
          install -D -m 644 res/linux/scacelith.desktop "$share/applications/scacelith.desktop"
          for size in 16 24 32 48 64 96 128 256 512; do
            install -D -m 644 "res/icons/png/scacelith-$size.png" \
              "$share/icons/hicolor/${size}x${size}/apps/scacelith.png"
          done
          mkdir -p "$dir/licences/fonts"
          cp LICENSE "$dir/LICENSE"
          cp assets/fonts/*.txt assets/fonts/hand/*.txt "$dir/licences/fonts/"
          cp third_party/stockfish/AUTHORS "$dir/licences/Stockfish-AUTHORS.txt"
          cp third_party/qrcodegen/LICENSE "$dir/licences/qrcodegen-MIT.txt"
          cp assets/licences/lichess-chess-openings-CC0.txt "$dir/licences/"
          cat > "$dir/README.txt" <<EOF
          Scacelith $VERSION for Linux x86-64

          A photorealistic chess game played in first person against a porcelain robot driven by
          Stockfish 19 (embedded), or online. Needs a GPU with OpenGL 4.6, an X11 desktop or Wayland
          with XWayland, glibc 2.34 and OpenSSL 3 (Ubuntu 22.04, Debian 12, Fedora 36, RHEL 9 and
          later); the sound goes through ALSA (libasound2, and PulseAudio or PipeWire through it).
          Run ./scacelith. ./install.sh adds the game to the applications menu (in ~/.local);
          ./install.sh --uninstall removes it. The settings, saved logins and log are kept in
          \$XDG_CONFIG_HOME/scacelith/, by default ~/.config/scacelith/ (next to the executable
          instead when a Scacelith.ini stands there); the logins' session tokens go to the desktop's
          keyring through libsecret (libsecret-1-0) when there is one (a locked keyring asks for its
          password when you sign in or connect), otherwise they stay in that folder, readable by
          their owner only.

          Source: $REPOSITORY ($REF_NAME, commit $COMMIT).
          Scacelith is free software under the GNU General Public License v3.0 (LICENSE). The licence
          texts of the fonts, of Stockfish's authors and of the other parts it embeds are in licences/.

          The coach's voice model (Supertonic 3, BigScience Open RAIL-M licence) is not included: the
          game offers to download it from Supertone's repository on Hugging Face the first time
          Coach mode needs it.

          To check this download with the GitHub CLI:
            gh attestation verify $name.tar.gz --repo $GITHUB_REPOSITORY
          EOF
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime="@$(git log -1 --format=%ct)" \
            -C dist -c "$name" | gzip -9n > "dist/$name.tar.gz"
          rm -r "${dir:?}"

      - name: Upload the Linux files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-linux-x86_64
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # The same build for Linux aarch64, on GitHub's Arm runner with Ubuntu 22.04 (the same toolchain
  # as the x86-64 release); the same checks, against the aarch64 dynamic loader.
  linux-aarch64:
    name: Linux aarch64 release build
    needs: version
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++ \
            libssl-dev libx11-dev libgl-dev desktop-file-utils

      - name: Configure
        run: >-
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSCACELITH_SUPERTONIC_DOWNLOAD=OFF

      - name: Build
        run: ninja -C build

      - name: Unit tests
        run: ./build/scacelith_tests

      - name: Check the executable
        run: |
          grep -q "#define SCACELITH_VERSION \"$VERSION\"" build/generated/scacelith_version.h
          grep -aq "Scacelith $VERSION" build/scacelith
          allowed=" libX11.so.6 libGL.so.1 libssl.so.3 libcrypto.so.3 libm.so.6 libc.so.6 ld-linux-aarch64.so.1 "
          needed=$(readelf -d build/scacelith | sed -n 's/.*(NEEDED).*\[\(.*\)\]/\1/p')
          for lib in $needed; do
            echo "needs $lib"
            if [[ "$allowed" != *" $lib "* ]]; then
              echo "::error::build/scacelith needs $lib, which is not on the list of system libraries"
              exit 1
            fi
          done
          glibc=$(objdump -T build/scacelith | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n 1)
          echo "newest glibc symbol version: $glibc"
          if [[ "$(printf '%s\n' "$glibc" GLIBC_2.34 | sort -V | tail -n 1)" != GLIBC_2.34 ]]; then
            echo "::error::build/scacelith needs $glibc, newer than the 2.34 the README promises"
            exit 1
          fi

      - name: Package
        env:
          COMMIT: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
        run: |
          name="Scacelith-$VERSION-linux-aarch64"
          dir="dist/$name"
          share="$dir/share"
          install -D -m 755 build/scacelith "$dir/scacelith"
          install -D -m 755 res/linux/install.sh "$dir/install.sh"
          desktop-file-validate res/linux/scacelith.desktop
          install -D -m 644 res/linux/scacelith.desktop "$share/applications/scacelith.desktop"
          for size in 16 24 32 48 64 96 128 256 512; do
            install -D -m 644 "res/icons/png/scacelith-$size.png" \
              "$share/icons/hicolor/${size}x${size}/apps/scacelith.png"
          done
          mkdir -p "$dir/licences/fonts"
          cp LICENSE "$dir/LICENSE"
          cp assets/fonts/*.txt assets/fonts/hand/*.txt "$dir/licences/fonts/"
          cp third_party/stockfish/AUTHORS "$dir/licences/Stockfish-AUTHORS.txt"
          cp third_party/qrcodegen/LICENSE "$dir/licences/qrcodegen-MIT.txt"
          cp assets/licences/lichess-chess-openings-CC0.txt "$dir/licences/"
          cat > "$dir/README.txt" <<EOF
          Scacelith $VERSION for Linux aarch64 (64-bit Arm)

          A photorealistic chess game played in first person against a porcelain robot driven by
          Stockfish 19 (embedded), or online. Needs a GPU with OpenGL 4.6, which on Arm means an
          NVIDIA GPU (Jetson Orin, discrete cards), an AMD discrete card, or Asahi Linux on Apple
          M1/M2; a Raspberry Pi 4 or 5 (OpenGL 3.1) cannot run it. Also needs an X11 desktop or
          Wayland with XWayland, glibc 2.34 and OpenSSL 3 (Ubuntu 22.04, Debian 12, Fedora 36,
          RHEL 9 and later); the sound goes through ALSA (libasound2, and PulseAudio or PipeWire
          through it).
          Run ./scacelith. ./install.sh adds the game to the applications menu (in ~/.local);
          ./install.sh --uninstall removes it. The settings, saved logins and log are kept in
          \$XDG_CONFIG_HOME/scacelith/, by default ~/.config/scacelith/ (next to the executable
          instead when a Scacelith.ini stands there); the logins' session tokens go to the desktop's
          keyring through libsecret (libsecret-1-0) when there is one (a locked keyring asks for its
          password when you sign in or connect), otherwise they stay in that folder, readable by
          their owner only.

          Source: $REPOSITORY ($REF_NAME, commit $COMMIT).
          Scacelith is free software under the GNU General Public License v3.0 (LICENSE). The licence
          texts of the fonts, of Stockfish's authors and of the other parts it embeds are in licences/.

          The coach's voice model (Supertonic 3, BigScience Open RAIL-M licence) is not included: the
          game offers to download it from Supertone's repository on Hugging Face the first time
          Coach mode needs it.

          To check this download with the GitHub CLI:
            gh attestation verify $name.tar.gz --repo $GITHUB_REPOSITORY
          EOF
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime="@$(git log -1 --format=%ct)" \
            -C dist -c "$name" | gzip -9n > "dist/$name.tar.gz"
          rm -r "${dir:?}"

      - name: Upload the Linux aarch64 files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-linux-aarch64
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # The experimental macOS build (Apple Silicon, macOS 26 or later): Scacelith.app with Mesa's
  # Zink on KosmicKrisp and the Vulkan loader inside, in a disk image. Built from scratch like the
  # others: the dependencies too are built from their pinned sources in this run, not restored
  # from the CI's cache (which pull requests can write), so that what the attestation covers is
  # built entirely here. The app is signed ad hoc only (no Developer ID): Gatekeeper asks the
  # player to allow it once. Experimental: its failure shows on the job but does not hold back the
  # release of the other platforms (continue-on-error; the release then has no disk image).
  macos:
    name: macOS (Apple Silicon) release build
    needs: version
    runs-on: macos-26
    timeout-minutes: 180
    continue-on-error: true
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the dependencies (Mesa, the Vulkan loader, OpenSSL)
        run: tools/macos/build-deps.sh build-macos-deps/prefix

      - name: Install the build tools
        run: brew install --formula --quiet cmake ninja

      - name: Configure
        run: >-
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSCACELITH_SUPERTONIC_DOWNLOAD=OFF
          -DOPENSSL_ROOT_DIR="$GITHUB_WORKSPACE/build-macos-deps/prefix/openssl"

      - name: Build
        run: ninja -C build

      - name: Unit tests
        run: ./build/scacelith_tests

      # The version, and what the executable needs from the system: macOS's own libraries only
      # (OpenSSL is linked in; Mesa is loaded from the bundle), arm64 code for macOS 26.
      - name: Check the executable
        run: |
          grep -q "#define SCACELITH_VERSION \"$VERSION\"" build/generated/scacelith_version.h
          grep -aq "Scacelith $VERSION" build/scacelith
          [[ "$(lipo -archs build/scacelith)" == arm64 ]]
          otool -l build/scacelith | grep -A3 LC_BUILD_VERSION
          otool -L build/scacelith
          if otool -L build/scacelith | tail -n +2 | awk '{print $1}' | grep -Ev '^(/usr/lib/|/System/Library/|@rpath/)'; then
            echo "::error::build/scacelith needs libraries outside macOS and the app bundle (above)"
            exit 1
          fi

      - name: Package
        run: |
          tools/macos/make-app.sh build build-macos-deps/prefix dist/Scacelith.app
          tools/macos/make-dmg.sh dist/Scacelith.app "dist/Scacelith-$VERSION-macos-arm64-experimental.dmg"
          rm -r dist/Scacelith.app

      - name: Upload the macOS files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-macos-arm64
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # The files of every platform together, with their checksums: what is attested and published,
  # and what a dry run keeps.
  files:
    name: Release files
    needs: [build, linux, linux-aarch64, macos]
    # Every platform but the experimental macOS one must have succeeded; macOS's result is not
    # looked at (a failed job with continue-on-error must not hold the release back).
    if: >-
      !cancelled() && needs.build.result == 'success' && needs.linux.result == 'success'
      && needs.linux-aarch64.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Download the files of each platform
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: build-*
          merge-multiple: true
          path: dist

      # The macOS build is experimental: when it failed, the release goes on without it.
      - name: Checksums
        run: |
          if ! compgen -G 'dist/*.dmg' > /dev/null; then
            echo "::warning::no macOS disk image: the experimental macOS build failed (see its job)"
          fi
          (cd dist && sha256sum -- * > SHA256SUMS)
          {
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-files
          path: dist/
          if-no-files-found: error
          retention-days: 30

  attest:
    name: Attest the build provenance
    needs: [version, files]
    # The results named, not the default success(), which also looks at the jobs before files
    # (the experimental macOS one among them).
    if: >-
      !cancelled() && needs.version.outputs.publish == 'true' && needs.version.result == 'success'
      && needs.files.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # the OIDC token that Sigstore signs the attestation with
      attestations: write # to store the attestation in the repository
    steps:
      - name: Download the release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-files
          path: dist

      - name: Attest the archives and the executable
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.zip
            dist/*.exe
            dist/*.tar.gz
            dist/*.dmg

  publish:
    name: Publish the GitHub release
    needs: [version, ci, attest]
    # As for attest: the results of the jobs it needs, not of the macOS build behind them.
    if: >-
      !cancelled() && needs.version.outputs.publish == 'true' && needs.version.result == 'success'
      && needs.ci.result == 'success' && needs.attest.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # to create the release and upload its files
    steps:
      - name: Download the release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-files
          path: dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          macos=""
          if compgen -G "dist/Scacelith-$VERSION-macos-arm64-experimental.dmg" > /dev/null; then
            macos="- **macOS (experimental)**: \`Scacelith-$VERSION-macos-arm64-experimental.dmg\`, for Apple
            Silicon (M1 or later) with macOS 26 or later: open it and drag Scacelith to Applications.
            OpenGL runs through Mesa (Zink on KosmicKrisp, Vulkan on Metal), inside the app. The app
            is not signed with an Apple Developer ID, so macOS blocks its first launch: allow it in
            System Settings > Privacy & Security > Open Anyway, or run
            \`xattr -dr com.apple.quarantine /Applications/Scacelith.app\`."
          fi
          cat > notes.md <<EOF
          Self-contained (Stockfish 19 and its network are embedded); needs a GPU with OpenGL 4.6.

          - **Windows x64**: \`Scacelith-$VERSION-windows-x64.zip\` (the executable with its licence)
            or the executable alone.
          - **Linux x86-64**: \`Scacelith-$VERSION-linux-x86_64.tar.gz\` (the executable, its launcher
            and icons, \`install.sh\` to add it to the applications menu, and the licences). Needs
            glibc 2.34 and OpenSSL 3 (Ubuntu 22.04, Debian 12, Fedora 36, RHEL 9 and later) and X11 or
            XWayland; the sound goes through ALSA (PulseAudio and PipeWire included), and the saved
            logins' tokens go to the desktop keyring through libsecret (libsecret-1-0) when available.
          - **Linux aarch64** (64-bit Arm): \`Scacelith-$VERSION-linux-aarch64.tar.gz\`, the same contents
            and requirements; OpenGL 4.6 on Arm means an NVIDIA GPU (Jetson Orin, discrete cards), an
            AMD discrete card or Asahi Linux on Apple M1/M2 (not a Raspberry Pi).
          $macos

          Every file is built by the release workflow from tag \`$TAG\`, and its build provenance is
          attested. To check a download with the GitHub CLI:

          \`\`\`sh
          gh attestation verify Scacelith-$VERSION-windows-x64.zip --repo $GH_REPO
          \`\`\`
          EOF
          flags=(--verify-tag --title "Scacelith $VERSION" --notes-file notes.md --generate-notes)
          if [[ "$PRERELEASE" == true ]]; then flags+=(--prerelease); else flags+=(--latest); fi
          gh release create "$TAG" "${flags[@]}" dist/*

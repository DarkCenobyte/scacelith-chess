# Continuous integration: the game built and tested on Linux and, cross-compiled with MinGW-w64,
# for Windows (its tests run under Wine), as the README's "Building" section describes; plus the
# workflows' own lint. The release workflow runs it again on the tagged commit (workflow_call).
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The ccache caches are written by pushes to master only; pull requests and releases read them.
  SAVE_CACHE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
  CCACHE_MAXSIZE: 2G
  CCACHE_COMPRESS: "true"

jobs:
  linux:
    name: Linux build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build ccache libssl-dev libx11-dev libgl-dev

      # The coach's voice model archive (129 MB) that the first configure downloads for the TTS tests
      # (third_party/supertonic3/supertonic3.cmake checks its SHA-256).
      - name: Restore the voice model archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/_deps/*.tar.bz2
          key: supertonic3-linux-${{ hashFiles('third_party/supertonic3/supertonic3.cmake') }}

      - name: Restore the compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-linux-${{ github.sha }}
          restore-keys: ccache-linux-

      - name: Configure
        run: >-
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: ninja -C build

      - name: Unit tests
        run: ./build/scacelith_tests

      - name: Compiler cache statistics
        if: always()
        run: ccache --show-stats

      - name: Save the compiler cache
        if: always() && env.SAVE_CACHE == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-linux-${{ github.sha }}

  windows:
    name: Windows build (MinGW-w64) and tests (Wine)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the cross-compiler and Wine
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build ccache \
            g++-mingw-w64-x86-64-posix gcc-mingw-w64-x86-64-posix binutils-mingw-w64-x86-64 wine64

      - name: Restore the voice model archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build-win/_deps/*.tar.bz2
          key: supertonic3-windows-${{ hashFiles('third_party/supertonic3/supertonic3.cmake') }}

      - name: Restore the compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-windows-${{ github.sha }}
          restore-keys: ccache-windows-

      - name: Configure
        run: >-
          cmake -B build-win -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64-x86_64.cmake
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      # Scacelith.exe and scacelith_tests.exe, with the instruction-set audits and the exception
      # table checks that run at every Windows build.
      - name: Build
        run: ninja -C build-win

      - name: Unit tests under Wine
        run: tools/test_win.sh

      - name: Compiler cache statistics
        if: always()
        run: ccache --show-stats

      - name: Save the compiler cache
        if: always() && env.SAVE_CACHE == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-windows-${{ github.sha }}

      # A test build of the game for this commit (the official builds come from the release
      # workflow, built without any cache).
      - name: Upload the game
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Scacelith-windows-x64-${{ github.sha }}
          path: build-win/Scacelith.exe
          if-no-files-found: error
          retention-days: 14

  workflows:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint and zizmor
        uses: taiki-e/install-action@861a07ce7084f55488e375df125cdc99bba60eb7 # v2.87.23
        with:
          tool: zizmor@1.30.1

      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --format=github --persona=regular .github/

# Continuous integration: the game built and tested on Linux (also with AddressSanitizer and UBSan)
# and, cross-compiled with MinGW-w64, for Windows (its tests run under Wine), as the README's
# "Building" section describes; on Linux aarch64; on macOS (Apple Silicon, experimental) with its
# app and disk image; the contract with the dedicated server pinned in
# tools/interop/server-revision and the live online tests against it; plus the workflows' own lint.
# The release workflow runs it again on the tagged commit (workflow_call). A weekly run checks the
# contract against the server's master, to see changes on its side early.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:
    inputs:
      server-revision:
        description: Branch, tag or commit of the server to check the contract against (empty = the pinned one)
        type: string
        default: ""
  workflow_call:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The ccache caches are written by pushes to master only; pull requests and releases read them.
  SAVE_CACHE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
  CCACHE_MAXSIZE: 2G
  CCACHE_COMPRESS: "true"

jobs:
  linux:
    name: Linux build and tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build ccache libssl-dev libx11-dev libgl-dev

      # The coach's voice model (399 MB, seven files from Hugging Face) that the first configure
      # downloads for the TTS tests (third_party/supertonic3/supertonic3.cmake checks their SHA-256).
      # This job requires it: without the files, or with one that does not verify, the configure
      # fails, and the tests that need the model must run and pass.
      - name: Restore the voice model files
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/_deps/supertonic-3/
          key: supertonic3-linux-${{ hashFiles('third_party/supertonic3/supertonic3.cmake') }}

      - name: Restore the compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-linux-${{ github.sha }}
          restore-keys: ccache-linux-

      - name: Configure
        run: >-
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSCACELITH_SUPERTONIC_REQUIRED=ON
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: ninja -C build

      # --require=tts-model: a test that skips for want of the voice model fails, and so does a run
      # where none passed with it (tests/test.h).
      - name: Unit tests
        shell: bash
        run: ./build/scacelith_tests --require=tts-model 2>&1 | tee build/unit-tests.log

      # Apart from the exit code: the reference tests of the voice model (the real files against the
      # manifest, the text front end, each stage and the end-to-end synthesis against the reference
      # outputs, the synthesizer, the worker) are in the log as run and passed.
      - name: Check that the voice model's reference tests ran
        shell: bash
        run: |
          missing=0
          for t in model_store_real_files tts_text_frontend_matches_reference tts_stage_duration_and_text_encoder \
                   tts_stage_vector_estimator tts_stage_vocoder_and_end_to_end tts_stage_every_level \
                   tts_synthesizer_output tts_worker; do
            if ! grep -q "^\[ OK \] $t (" build/unit-tests.log; then
              echo "::error::$t did not run and pass with the voice model"
              missing=1
            fi
          done
          exit "$missing"

      - name: Compiler cache statistics
        if: always()
        run: ccache --show-stats

      - name: Save the compiler cache
        if: always() && env.SAVE_CACHE == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-linux-${{ github.sha }}

  # The same build and tests on Linux aarch64 (GitHub's Arm runner), Stockfish built for the Arm
  # instruction sets and the coach's voice on its NEON kernels; the voice model is required here
  # too.
  linux-aarch64:
    name: Linux aarch64 build and tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build ccache libssl-dev libx11-dev libgl-dev

      - name: Restore the voice model files
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/_deps/supertonic-3/
          key: supertonic3-linux-aarch64-${{ hashFiles('third_party/supertonic3/supertonic3.cmake') }}

      - name: Restore the compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-linux-aarch64-${{ github.sha }}
          restore-keys: ccache-linux-aarch64-

      - name: Configure
        run: >-
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSCACELITH_SUPERTONIC_REQUIRED=ON
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: ninja -C build

      - name: Unit tests
        shell: bash
        run: ./build/scacelith_tests --require=tts-model 2>&1 | tee build/unit-tests.log

      - name: Check that the voice model's reference tests ran
        shell: bash
        run: |
          missing=0
          for t in model_store_real_files tts_text_frontend_matches_reference tts_stage_duration_and_text_encoder \
                   tts_stage_vector_estimator tts_stage_vocoder_and_end_to_end tts_stage_every_level \
                   tts_synthesizer_output tts_worker; do
            if ! grep -q "^\[ OK \] $t (" build/unit-tests.log; then
              echo "::error::$t did not run and pass with the voice model"
              missing=1
            fi
          done
          exit "$missing"

      - name: Compiler cache statistics
        if: always()
        run: ccache --show-stats

      - name: Save the compiler cache
        if: always() && env.SAVE_CACHE == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-linux-aarch64-${{ github.sha }}

  sanitizers:
    name: Linux tests under AddressSanitizer and UBSan
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build ccache libssl-dev libx11-dev libgl-dev

      # The voice model too, so that the coach's voice runs under the sanitizers.
      - name: Restore the voice model files
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build-san/_deps/supertonic-3/
          key: supertonic3-linux-${{ hashFiles('third_party/supertonic3/supertonic3.cmake') }}

      - name: Restore the compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-sanitizers-${{ github.sha }}
          restore-keys: ccache-sanitizers-

      # Without Stockfish (its own code, built apart and tested upstream): the game's code and the
      # unit tests, every finding fatal (CMakeLists.txt, SCACELITH_SANITIZE).
      - name: Configure
        run: >-
          cmake -B build-san -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DSCACELITH_STOCKFISH=OFF
          -DSCACELITH_SANITIZE=address,undefined
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: ninja -C build-san scacelith_tests

      - name: Unit tests
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:detect_stack_use_after_return=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ./build-san/scacelith_tests

      - name: Compiler cache statistics
        if: always()
        run: ccache --show-stats

      - name: Save the compiler cache
        if: always() && env.SAVE_CACHE == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-sanitizers-${{ github.sha }}

  windows:
    name: Windows build (MinGW-w64) and tests (Wine)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the cross-compiler and Wine
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build ccache \
            g++-mingw-w64-x86-64-posix gcc-mingw-w64-x86-64-posix binutils-mingw-w64-x86-64 wine wine64

      - name: Restore the voice model files
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build-win/_deps/supertonic-3/
          key: supertonic3-windows-${{ hashFiles('third_party/supertonic3/supertonic3.cmake') }}

      - name: Restore the compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-windows-${{ github.sha }}
          restore-keys: ccache-windows-

      - name: Configure
        run: >-
          cmake -B build-win -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64-x86_64.cmake
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      # Scacelith.exe and scacelith_tests.exe, with the instruction-set audits and the exception
      # table checks that run at every Windows build.
      - name: Build
        run: ninja -C build-win

      - name: Unit tests under Wine
        run: tools/test_win.sh

      - name: Compiler cache statistics
        if: always()
        run: ccache --show-stats

      - name: Save the compiler cache
        if: always() && env.SAVE_CACHE == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-windows-${{ github.sha }}

      # A test build of the game for this commit (the official builds come from the release
      # workflow, built without any cache).
      - name: Upload the game
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Scacelith-windows-x64-${{ github.sha }}
          path: build-win/Scacelith.exe
          if-no-files-found: error
          retention-days: 14

  # The experimental macOS port (Apple Silicon, macOS 26 or later): OpenGL 4.6 through Mesa's Zink
  # on KosmicKrisp (Vulkan on Metal 4), shipped inside the app. The dependencies (Mesa, the Vulkan
  # loader, OpenSSL; tools/macos/build-deps.sh, about an hour) are built from their pinned sources
  # when the cache has no prefix for the current script and patches, then the game is built and
  # tested, and Scacelith.app and its disk image are made (tools/macos/). Experimental: a failure
  # shows on the job without failing the run (continue-on-error), so it holds back neither the
  # other platforms' checks nor, through the release workflow's CI, a release.
  macos:
    name: macOS (Apple Silicon) build, tests and app
    if: github.event_name != 'schedule'
    runs-on: macos-26
    timeout-minutes: 150
    continue-on-error: true
    permissions:
      contents: read
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Keyed on what decides their content (the build script, the Mesa patches, the Python
      # packages of Mesa's build); written by any run that had to build them, so that the hour
      # is spent once per change of those files (a pull request's entry is visible to that pull
      # request only).
      - name: Restore the macOS dependencies
        id: deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build-macos-deps/prefix
          key: macos-deps-arm64-${{ hashFiles('tools/macos/build-deps.sh', 'tools/macos/lib.sh', 'tools/macos/mesa-patches/*.patch', 'tools/macos/requirements-mesa.txt') }}

      - name: Build the macOS dependencies (Mesa, the Vulkan loader, OpenSSL)
        if: steps.deps.outputs.cache-hit != 'true'
        run: tools/macos/build-deps.sh build-macos-deps/prefix

      - name: Save the macOS dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build-macos-deps/prefix
          key: ${{ steps.deps.outputs.cache-primary-key }}

      # Also after a restore: the prefix is whole, and its libraries pass the checks of a build.
      - name: Check the macOS dependencies
        run: tools/macos/build-deps.sh --verify build-macos-deps/prefix

      - name: Install the build tools
        run: brew install --formula --quiet cmake ninja ccache

      # Not required on macOS: the Linux jobs (x86-64 and aarch64) are those that require the
      # voice model's reference tests to run; here they run when the download succeeded.
      - name: Restore the voice model files
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/_deps/supertonic-3/
          key: supertonic3-macos-${{ hashFiles('third_party/supertonic3/supertonic3.cmake') }}

      - name: Restore the compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-macos-${{ github.sha }}
          restore-keys: ccache-macos-

      - name: Configure
        run: >-
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DOPENSSL_ROOT_DIR="$GITHUB_WORKSPACE/build-macos-deps/prefix/openssl"
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: ninja -C build

      - name: Unit tests
        run: ./build/scacelith_tests

      - name: Make the app and its disk image
        run: |
          version=$(cmake -P cmake/version.cmake)
          tools/macos/make-app.sh build build-macos-deps/prefix dist/Scacelith.app
          tools/macos/make-dmg.sh dist/Scacelith.app "dist/Scacelith-$version-macos-arm64-experimental.dmg"

      # A first frame from the bundled app, on the runner's virtual GPU (Apple's paravirtualized
      # graphics). KosmicKrisp does not support that GPU: the Vulkan loader finds no device, so the
      # app stops at its "Could not start OpenGL 4.6" message box after loading its EGL and its
      # Vulkan driver. That outcome is reported as a notice; any other failure (a crash, a missing
      # library, no screenshot) fails the step, which only warns (continue-on-error). A run still
      # going after six minutes is sampled (its threads' stacks, printed and uploaded), then stopped.
      - name: Smoke run of the app (headless screenshot)
        continue-on-error: true
        timeout-minutes: 10
        env:
          SCACELITH_AUDIO: "null"
          VK_LOADER_DEBUG: error,warn
        run: |
          mkdir -p smoke
          status=0
          dist/Scacelith.app/Contents/MacOS/Scacelith --scene game --shot "$PWD/smoke/smoke.png" \
            --frames 4 --size 640x360 --start --no-intro --human white > smoke/smoke.log 2>&1 < /dev/null &
          pid=$!
          for ((t = 0; t < 360; t += 5)); do
            kill -0 "$pid" 2> /dev/null || break
            # The message box of a failed start waits for a click that never comes.
            grep -q 'could not initialise OpenGL 4.6' smoke/smoke.log && break
            sleep 5
          done
          if kill -0 "$pid" 2> /dev/null; then
            if ! grep -q 'could not initialise OpenGL 4.6' smoke/smoke.log; then
              sample "$pid" 5 -mayDie -file smoke/sample.txt > /dev/null 2>&1 || true
            fi
            kill -TERM "$pid" 2> /dev/null || true
            sleep 3
            kill -KILL "$pid" 2> /dev/null || true
            wait "$pid" 2> /dev/null || true
            status=124
          else
            wait "$pid" || status=$?
          fi
          cat smoke/smoke.log
          if [[ -f smoke/sample.txt ]]; then
            echo "::group::Stacks of the smoke run after six minutes"
            head -n 600 smoke/sample.txt
            echo "::endgroup::"
          fi
          if [[ $status -eq 0 && -f smoke/smoke.png ]]; then
            exit 0
          fi
          if grep -q 'Failed to detect any valid GPUs' smoke/smoke.log &&
             grep -q 'gl: EGL from .*/Scacelith.app/Contents/Frameworks/libEGL' smoke/smoke.log; then
            echo "::notice::the runner's virtual GPU is not one KosmicKrisp supports: the app loaded its EGL and its Vulkan driver, then reported that no supported GPU was found (a Mac with Apple silicon is needed to draw a frame)"
            exit 0
          fi
          echo "::warning::the smoke run failed (exit code $status): see its log above"
          exit 1

      - name: Upload the smoke run's screenshot and log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Scacelith-macos-smoke-${{ github.sha }}
          path: smoke/
          if-no-files-found: ignore
          retention-days: 14

      # A test build of the disk image for this commit, as for Windows (the official one comes
      # from the release workflow).
      - name: Upload the disk image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Scacelith-macos-arm64-${{ github.sha }}
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Compiler cache statistics
        if: always()
        run: ccache --show-stats || true

      - name: Save the compiler cache
        if: always() && env.SAVE_CACHE == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-macos-${{ github.sha }}

  interop:
    name: Contract and live tests with the server
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: game
          persist-credentials: false

      # The server's commit pinned in tools/interop/server-revision (the pair known to work
      # together, so a run of the same game commit always checks the same pair); the server's
      # master on the weekly run; or what a manual run names (a change made on both sides: run
      # this workflow on the game's branch with the server's branch).
      - name: Choose the server's revision
        id: server
        env:
          EVENT: ${{ github.event_name }}
          REQUESTED: ${{ inputs.server-revision }}
        run: |
          pinned=$(grep -Ev '^[[:space:]]*(#|$)' game/tools/interop/server-revision | head -n 1 | tr -d '[:space:]')
          if [[ ! "$pinned" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::tools/interop/server-revision does not hold a full commit hash"
            exit 1
          fi
          if [[ -n "$REQUESTED" ]]; then ref=$REQUESTED
          elif [[ "$EVENT" == schedule ]]; then ref=master
          else ref=$pinned
          fi
          echo "revision=$ref" >> "$GITHUB_OUTPUT"
          echo "Server revision: $ref (pinned: $pinned)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DarkCenobyte/scacelith-chess-server
          ref: ${{ steps.server.outputs.revision }}
          path: server
          persist-credentials: false

      - name: Name the pair under test
        run: |
          echo "Game $(git -C game rev-parse HEAD), server $(git -C server rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install the build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libssl-dev libx11-dev libgl-dev

      - name: Install the server's toolchain (its rust-toolchain.toml)
        working-directory: server
        run: rustup toolchain install

      # The C++ codec, the copy of the protocol, the rating vectors, the PGN files and the chess
      # cross-check vectors, checked by the server's own script.
      - name: Contract (the server's tools/interop/check-game.sh)
        run: server/tools/interop/check-game.sh game

      # The live tests need neither Stockfish nor the coach's voice model.
      - name: Build the tests
        run: |
          cmake -S game -B game/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DSCACELITH_STOCKFISH=OFF -DSCACELITH_SUPERTONIC_DOWNLOAD=OFF
          ninja -C game/build scacelith_tests

      - name: Build the server and its live-check harness
        working-directory: server
        run: cargo build --locked -p scacelith-server -p scacelith-live-check

      - name: Live tests (the online client against that server)
        working-directory: game
        run: ../server/target/debug/scacelith-live-check build/scacelith_tests

  workflows:
    name: Workflow lint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint and zizmor
        uses: taiki-e/install-action@861a07ce7084f55488e375df125cdc99bba60eb7 # v2.87.23
        with:
          tool: zizmor@1.30.1

      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --format=github --persona=regular .github/

# Test coverage of the game's own code (src/): the unit tests and the X11 desktop tests of a Linux
# build instrumented for gcov (CMakeLists.txt, SCACELITH_COVERAGE; Stockfish, built apart, is not
# counted), measured by gcovr. The game is built too, so that the code no test runs counts as not
# covered (the unit tests run the scenes, the menus and the renderer on a null OpenGL: tests/headless.h).
# The coach voice's audio synthesis is left out: its
# tests skip in this build (tests/tts_tests.cpp; instrumented, they took 13 to 50 minutes of the
# run, the other CI jobs run them) and its code (src/tts but the text front end and the model
# store) is not measured. The run's summary shows the line, function and
# branch coverage; on master, the line coverage also goes to coverage.json on the badges branch,
# which the README's coverage badge reads (a shields.io endpoint badge). Not one of the checks
# master requires.
name: Coverage

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  coverage:
    name: Test coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libssl-dev libx11-dev libgl-dev \
            xvfb openbox gcovr

      # The coach's voice model, as in the CI's Linux job (the same cache), for the tests that read
      # its files without synthesizing (the text front end against the reference, the model store).
      - name: Restore the voice model files
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/_deps/supertonic-3/
          key: supertonic3-linux-${{ hashFiles('third_party/supertonic3/supertonic3.cmake') }}

      # One Stockfish variant (the runners have AVX2): the engine is not measured, only used.
      - name: Configure
        run: >-
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DSCACELITH_COVERAGE=ON
          -DSCACELITH_SF_VARIANTS=x86-64-avx2 -DSCACELITH_SUPERTONIC_REQUIRED=ON

      - name: Build
        run: ninja -C build scacelith scacelith_tests

      - name: Unit tests
        run: ./build/scacelith_tests --require=tts-model

      - name: X11 desktop tests
        run: tools/test_x11.sh build

      - name: Measure
        run: |
          mkdir -p coverage
          gcovr --root . --filter 'src/' --exclude 'src/tts/(?!text\.|nfkd_table\.|model_store\.)' \
            --json-summary coverage/summary.json --txt coverage/coverage.txt build
          python3 -I tools/coverage_badge.py coverage/summary.json coverage/coverage.json "$GITHUB_STEP_SUMMARY"

      - name: Upload the coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  # The badge's figure on the badges branch: one commit holding coverage.json, replaced at each
  # push to master (the only job of these workflows that writes to the repository).
  badge:
    name: Coverage badge
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
          path: coverage

      - name: Publish coverage.json on the badges branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q -b badges badges
          cp coverage/coverage.json badges/
          git -C badges add coverage.json
          git -C badges -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Test coverage of $GITHUB_SHA"
          git -C badges push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:refs/heads/badges

# CodeQL code scanning of the game's C++ code (without a build) and of the workflows; the alerts
# are in the repository's Security tab. The vendored code (third_party/), the tests (tests/) and the
# handshake research tools (tools/handshake/), which are not shipped, are left out. Without a
# build (build-mode: none), paths-ignore leaves out the source files under those folders, not the
# code that a scanned file #includes: a vendored library's implementation is compiled in units of
# its own (Stockfish: third_party/stockfish/CMakeLists.txt; qrcodegen and stb_truetype: GAME_EXTRA
# in CMakeLists.txt), and the game's code includes only its headers.
name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "41 3 * * 2"
  workflow_dispatch:

permissions: {}

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      security-events: write # to upload the results to code scanning
    strategy:
      fail-fast: false
      matrix:
        language: [c-cpp, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - third_party
              - tests
              - tools/handshake
              - build
              - build-win

      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}

# Dependabot version updates. The game has no package manager: Stockfish, the fonts and the other
# third-party code are vendored in third_party/ and assets/, and the coach's voice model is pinned
# by Hugging Face revision and SHA-256 in third_party/supertonic3/supertonic3.cmake and
# src/tts/model_store.cpp (the code and the model are updated by hand, see their
# README.scacelith.md). What Dependabot keeps up to date is the GitHub Actions of .github/workflows,
# pinned by commit SHA with the version in a comment, which it updates together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    # A new release is only proposed once it is a week old (a compromised release is usually
    # found and pulled within days); security updates are not delayed.
    cooldown:
      default-days: 7
    # Minor and patch updates in one pull request; each major update in its own.
    groups:
      github-actions:
        update-types: [minor, patch]
    commit-message:
      prefix: ci
    open-pull-requests-limit: 5
